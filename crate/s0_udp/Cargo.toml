[package]
name = "s0_udp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "sync0 基于 compio 的高速 UDP 传输、线协议、自适应 Zstd 与 Dragonfly P2P 引擎"
readme = "../../README.md"

[dependencies]
base64 = "0.23.1"
coarsetime = "0.1.38"
ed25519-dalek = "3.0.0"
fastrand = "2.5.0"
gxhash = "3.5.0"
ignore = "0.4.34"
itoa = "1.0.18"
jiff = "0.2.40"
log = "0.4.35"
mzstd = "0.2.11"
parking_lot = "0.13.0"
phf = { version = "0.14.0", features = ["macros"] }
s0_cc = { version = "0.1.0", path = "../s0_cc" }
s0_cdc = { version = "0.1.0", path = "../s0_cdc" }
s0_conf = { version = "0.1.0", path = "../s0_conf" }
socket2 = "0.6.5"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
zmij = "1.0.23"

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
fastrand = "2.5.0"
log_init = "0.1.40"
tempfile = "3.27.0"
