[package]
name = "s0_peer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "sync0 超快的文件同步：全对称 P2P 节点引擎、多源条带化调度与动态折半抢占 Work-Stealing 库"
readme = "../../README.md"

[dependencies]
base64 = "0.23.1"
fastrand = "2.5.0"
gxhash = "3.5.0"
iroh = "1.4.1"
notify = "8.2.2"
parking_lot = "0.13.0"
roaring = "0.12.0"
s0_cdc = { version = "0.1.4", path = "../s0_cdc" }
s0_codec = { version = "0.1.4", path = "../s0_codec" }
s0_conf = { version = "0.1.4", path = "../s0_conf" }
s0_const = { version = "0.1.4", path = "../s0_const" }
s0_fs = { version = "0.1.4", path = "../s0_fs" }
s0_udp = { version = "0.1.4", path = "../s0_udp" }
s0_wire = { version = "0.1.4", path = "../s0_wire" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "io-util"] }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log_init = "0.1.40"
tempfile = "3.27.0"
