about: Peer-to-peer file synchronization နှင့် multi-node ဖြန့်ချီရေးကိရိယာများ
send_about: ဖိုင် သို့မဟုတ် လမ်းညွှန်ကို ပို့ပါ။
recv_about: ဖိုင် သို့မဟုတ် လမ်းညွှန်ကို လက်ခံပါ။
id_about: local node လိပ်စာကို ထုတ်ပါ။
profile_about: ကိုယ်ပိုင် node လုပ်ငန်းကတ်များကို ထုတ်လုပ်ပြီး လက်မှတ်ထိုးပါ။
share_about: တစ်ခု သို့မဟုတ် တစ်ခုထက်ပိုသော ဖိုင်မျှဝေသည့်အဖွဲ့များကို ထုတ်ဝေပါ။
pull_about: ရွေးချယ်ထားသော ဖိုင်များနှင့် လမ်းညွှန်များအားလုံးကို မျှဝေခြင်းအဖွဲ့မှ ဆွဲထုတ်ပါ။
push_about: မျှဝေသည့်အဖွဲ့သို့ ဖိုင်များ သို့မဟုတ် လမ်းညွှန်များကို အပ်လုဒ်လုပ်ပါ။
sub_about: အဖွဲ့အပ်ဒိတ်များကို မျှဝေရန် စာရင်းသွင်းပြီး ဖြန့်ဖြူးရာတွင် ကူညီပေးပါ။
group_about: Multi-node နှစ်ခု-လမ်းတူ ထပ်တူပြုခြင်းအဖွဲ့တွင် ပါဝင်ပါ။
arg_file_or_dir: ပို့ရမည့် ဖိုင် သို့မဟုတ် လမ်းညွှန်
arg_peer_addr: ပစ်မှတ် node လိပ်စာ
arg_listen_addr: နားထောင်ရန်လိပ်စာ
arg_out_path: အထွက်ဖိုင် သို့မဟုတ် လမ်းညွှန်လမ်းကြောင်း
arg_rate: နှုန်းကန့်သတ်ချက် (ဘိုက်/စက္ကန့်)
arg_delete: လက်ခံရေးအဆုံးတွင် မလိုအပ်သောဖိုင်များကို ဖျက်ပါ။
arg_quiet: အသံတိတ်မုဒ်
arg_share_name: အုပ်စုများနှင့်လမ်းကြောင်းများကိုမျှဝေပါ။
arg_local_dir: ဒေသဆိုင်ရာလမ်းညွှန်
arg_dst_dir: ပစ်မှတ်လမ်းညွှန်
arg_src_dir: ဒေသဆိုင်ရာအရင်းအမြစ်လမ်းကြောင်း
arg_peer_addrs_csv: node လိပ်စာများစာရင်း (ကော်မာကို ခွဲခြားထားသည်)
arg_origin_addr: အရင်းအမြစ် node လိပ်စာ
arg_subpath: ဖိုင် သို့မဟုတ် လမ်းညွှန်လမ်းကြောင်းများ ရွေးချယ်မှုအများအပြား (ကော်မာကို ခွဲခြားထားသည်)
arg_auth: ဝင်ရောက်စစ်မှန်ကြောင်းအထောက်အထားပြသခြင်းကို ဖွင့်ပါ။
arg_group_name: အုပ်စုအမည်နှင့်လမ်းကြောင်း
arg_config: သော့နှင့်ဖွဲ့စည်းမှုလမ်းညွှန်
arg_name: အသုံးပြုသူအမည်
arg_region: မြို့ သို့မဟုတ် ဧရိယာကုဒ်
arg_email: ဆက်သွယ်ရန်အီးမေးလ်
arg_url: ကိုယ်ရေးကိုယ်တာ URL
arg_bio: စိတ်ကြိုက်သတ်မှတ်ထားသော လက်မှတ် (အများဆုံး 256 လုံး)
err_prefix: အမှား