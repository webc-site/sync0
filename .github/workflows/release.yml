name: Release (.tar.xz Minimized Binaries)

on:
  push:
    tags:
      - "v*"
      - "sync0-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. sync0-v0.1.0)"
        required: false
        default: "sync0-v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (io_uring + polling)
          - platform: linux-x64-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: cargo
            bin_name: sync0
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: cargo
            bin_name: sync0
          # Linux MUSL Static (io_uring + polling)
          - platform: linux-x64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            builder: zigbuild
            bin_name: sync0
          - platform: linux-arm64-musl
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            builder: zigbuild
            bin_name: sync0
          # Android NDK (compio epoll polling)
          - platform: android-arm64
            os: ubuntu-24.04
            target: aarch64-linux-android
            builder: ndk
            bin_name: sync0
          - platform: android-x64
            os: ubuntu-24.04
            target: x86_64-linux-android
            builder: ndk
            bin_name: sync0
          # macOS (compio kqueue polling)
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            builder: cargo
            bin_name: sync0
          - platform: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            builder: cargo
            bin_name: sync0
          # iOS (compio kqueue polling)
          - platform: ios-arm64
            os: macos-15
            target: aarch64-apple-ios
            builder: cargo
            bin_name: sync0
          - platform: ios-arm64-sim
            os: macos-15
            target: aarch64-apple-ios-sim
            builder: cargo
            bin_name: sync0
          - platform: ios-x64-sim
            os: macos-15
            target: x86_64-apple-ios
            builder: cargo
            bin_name: sync0
          # Windows MSVC (compio IOCP)
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            builder: cargo
            bin_name: sync0.exe
          - platform: windows-arm64
            os: windows-2025
            target: aarch64-pc-windows-msvc
            builder: cargo
            bin_name: sync0.exe
          # FreeBSD & NetBSD (compio kqueue + POSIX AIO)
          - platform: freebsd-x64
            os: ubuntu-24.04
            target: x86_64-unknown-freebsd
            builder: cross
            bin_name: sync0
          - platform: netbsd-x64
            os: ubuntu-24.04
            target: x86_64-unknown-netbsd
            builder: cross
            bin_name: sync0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Zig & cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cargo-ndk
        if: matrix.builder == 'ndk'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build minimized release binary
        shell: bash
        run: |
          case "${{ matrix.builder }}" in
            zigbuild)
              cargo zigbuild --release --target "${{ matrix.target }}" -p sync0
              ;;
            ndk)
              export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
              cargo ndk -t "${{ matrix.target }}" --platform 28 build --release -p sync0
              ;;
            cross)
              cross build --release --target "${{ matrix.target }}" -p sync0
              ;;
            *)
              cargo build --release --target "${{ matrix.target }}" -p sync0
              ;;
          esac

      - name: Package binary as .tar.xz
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/
          ARCHIVE="sync0-${{ matrix.platform }}.tar.xz"
          XZ_OPT="-9e" tar -cJf "dist/$ARCHIVE" -C dist "${{ matrix.bin_name }}"
          rm -f "dist/${{ matrix.bin_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          else
            (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")
          fi
          ls -lh dist/

      - name: Upload .tar.xz artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/sync0-${{ matrix.platform }}.tar.xz
            dist/sync0-${{ matrix.platform }}.tar.xz.sha256

  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Download all .tar.xz artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release_assets

      - name: List release assets
        run: ls -lh release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'sync0-v0.1.0' }}
          generate_release_notes: true
          files: |
            release_assets/*.tar.xz
            release_assets/*.tar.xz.sha256
