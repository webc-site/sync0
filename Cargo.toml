[workspace]
resolver = "3"
members = ["crate/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-site/sync0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
incremental = false

[profile.release.package.s0_cc]
opt-level = 3

[profile.release.package.s0_cdc]
opt-level = 3

[profile.release.package.s0_codec]
opt-level = 3

[profile.release.package.s0_fs]
opt-level = 3

[profile.release.package.s0_udp]
opt-level = 3

[profile.release.package.s0_wire]
opt-level = 3

[profile.release.package.gxhash]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
